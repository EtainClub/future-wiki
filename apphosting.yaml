runConfig:
  minInstances: 0
  maxInstances: 20
  concurrency: 40
  cpu: 1
  memoryMiB: 1024

env:
  - variable: ANTHROPIC_API_KEY
    secret: anthropic-api-key
  - variable: GITHUB_APP_ID
    secret: github-app-id
  - variable: GITHUB_APP_PRIVATE_KEY
    secret: github-app-private-key
  - variable: GITHUB_APP_INSTALLATION_ID
    secret: github-app-installation-id
  - variable: GITHUB_REPOSITORY
    secret: github-repository
  - variable: GITHUB_WEBHOOK_SECRET
    secret: github-webhook-secret
  - variable: FIREBASE_STORAGE_BUCKET
    secret: firebase-storage-bucket
  - variable: REQUIRE_APP_CHECK
    value: "true"
    availability:
      - RUNTIME

  # NEXT_PUBLIC_* 는 빌드 시 클라이언트 번들에 인라인되므로 BUILD 가용성이 필요하다.
  # 값이 없으면 firebase/client.ts의 clientApp()이 null을 반환해 관리자 Google 로그인과
  # App Check가 모두 동작하지 않는다. Firebase 웹 설정은 공개되도록 설계된 값이다.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyBjcx7HdrTpjDsfdRmFHqnfF_WUapBI36g"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "future-wiki.firebaseapp.com"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "future-wiki"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:571369756907:web:e14c8df3ac9ec0dcb6c6ae"
    availability:
      - BUILD
      - RUNTIME
  # App Check 등록 후 아래 항목을 실제 사이트 키로 되살린다.
  # value: "" 는 App Hosting 검증기가 "값 없음"으로 보고 빌드를 거부하므로 넣지 않는다.
  # 변수가 없으면 getAppCheckToken()이 null을 반환하고, 프로덕션의 verifyAppCheck가
  # /api/ask를 401로 막는다 — 키를 채우기 전까지 질문 기능은 동작하지 않는다.
  # - variable: NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY
  #   value: "<reCAPTCHA Enterprise 사이트 키>"
  #   availability:
  #     - BUILD
  #     - RUNTIME
