review_status: machine-extracted-needs-spotcheck
notice: >-
  예언 본문이 아니라 각 象에 붙은 주석이다. 예언으로 인용하면 안 되고,
  사후 해석이 어떻게 붙는지를 보여주는 사례로만 쓴다. 본문은 raw/tuibeitu/ 에 있다.
lens: tuibeitu
method: posthumous-attribution
record_reliability: D
canonical_edition: >-
  金聖歎 批註本. 《中國預言七種》 清溪散人 編, 上海中華書局·文明書局, 1915년 간행.
  zh.wikisource 전사본에서 기계 추출. 60象 전부에 주석이 붙어 있다.
attribution_note: >-
  金聖歎(1608-1661)에게 귀속되는 주석이지만 이 형태로 확인되는 것은 1915년 간행본이며
  귀속 자체가 논란거리다. 내용은 대부분 이미 일어난 왕조 교체를 각 象에 대응시키는
  방식이라("此象主武曌當國" 등), 예언의 적중이 아니라 사후 해석의 전형적 사례다.
  method를 posthumous-attribution으로, 기록 신뢰도를 D로 둔 이유가 이것이다.
  이 자료를 인용할 때는 prophecy.interpretedAfter를 true로 두는 근거로만 써야 하며,
  예언이 사건을 맞혔다는 근거로 사용해서는 안 된다.
