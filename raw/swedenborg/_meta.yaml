attribution_note: >-
  이 저장소는 원칙적으로 번역을 raw/에 두지 않는다. 역자 저작권이 걸리고 앵커가 원문이
  아니라 번역을 가리키기 때문이다. 이 자료는 예외로 수집했고 근거는 두 가지다.
  첫째, 스베덴보리의 라틴어 원전은 정제된 전사본이 확인되지 않는다(la.wikisource에
  색인 수준의 문서만 있다). 둘째, 그의 저작은 판본과 언어에 상관없이 절 번호가 고정되어
  있어 앵커가 특정 번역본에 종속되지 않는다. 다른 판본과 절 번호로 대조할 수 있다.
  기록 신뢰도 A는 "예언이 맞았다"가 아니라 "스베덴보리(1688-1772)가 1758년에 이 내용을
  간행했음이 확인된다"는 뜻이다. 저자와 간행 시점이 모두 분명한, 이 저장소에서 드문 경우다.
  내용은 태양계 각 행성의 거주자와 대화했다는 서술이며 현대 천문학과 정면으로 어긋난다.
  적중 여부가 확인 가능한 자료이므로, 기록 신뢰도가 높다는 것과 예언이 맞았다는 것이
  서로 다른 축임을 보여 주는 사례로 쓴다.
