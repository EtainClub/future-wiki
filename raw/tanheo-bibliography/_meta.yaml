title: 탄허 — 연보와 저작 목록 (서지 기록)
copyright: public-domain
collected_at: 2026-08-30
review_status: machine-extracted-needs-spotcheck
notice: >-
  탄허의 글이나 강의 원문이 아니다. 생몰·행적·간행 사실만 담은 서지 기록이며,
  예언 구절의 근거로 인용할 수 없다.
lens: tanheo
method: cosmic-cycle
record_reliability: A
canonical_edition: >-
  ko.wikipedia "탄허" 문서(CC BY-SA 4.0)에서 사실 항목만 구조화했다.
  원 문서가 참조한 연보·영상 자료는 재대조하지 않았으므로 개별 연도는 대조가 필요하다.
attribution_note: >-
  이 자료의 기록 신뢰도 A는 "예언이 맞았다"가 아니라 "이 간행과 행적이 실재함을
  확인할 수 있다"는 뜻이다. 연도와 간행 사실은 저작권 대상이 아닌 사실이므로 수록했다.
  탄허(1913-1983)의 저작은 2053년까지 보호되므로 원문은 넣지 않는다. 이 저장소가
  탄허의 문장을 직접 인용하려면 정당한 인용 범위 안에서 따로 판단해야 한다.
  중요한 구조적 사실 하나는, 한반도와 지구의 변화에 관한 탄허의 도참적 발언이 주로
  김일부 《정역》에 근거한 것으로 평가된다는 점이다. 그런데 《정역》 원전은 아직 이
  저장소에 없다(docs/source-survey.md의 "전사본 부재" 참조). 따라서 tanheo 렌즈의
  유추는 당분간 周易 원문과 이 서지 기록에 기대야 하며, 그 한계를 답변에 밝혀야 한다.
