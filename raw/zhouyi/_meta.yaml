canonical_edition: >-
  zh.wikisource 전사본(교정률 50% 표시). 통행본(王弼本) 64괘 순서를 따르며,
  괘 순서는 색인의 "上下經卦名次序" 표에서 기계 추출했다. 마왕퇴 백서본 등 출토본은
  괘 순서와 자구가 다르므로 이 파일과 대조할 수 없다.
attribution_note: >-
  經은 서주 시대에 성립한 점사로, 특정 개인의 저작이 아니라 축적된 점복 기록이다.
  문헌 자체가 고대부터 실재했음은 확립되어 있어 기록 신뢰도를 A로 둔다.
  다만 이는 "텍스트가 그 시대에 존재했다"는 뜻이지 개별 괘사·효사의 저자나
  성립 시점을 특정할 수 있다는 뜻이 아니다.
  十翼은 공자 저작으로 전해지나 학계는 전국~한대 성립으로 보며, 經에 붙은 주석이므로
  별도 출처로 분리했다. 두 층위를 섞으면 후대 해석이 원 점사로 인용된다.
  괘마다 효사 수가 달라(乾·坤은 用九·用六 포함 7개) 고정 줄 배치를 쓸 수 없어
  파일 헤더에 괘별 시작 줄 색인을 넣었다. 64괘 전부 색인과 실제 위치를 대조 검증했다.
