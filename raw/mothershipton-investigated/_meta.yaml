  en.wikisource 전사본. William H. Harrison, 《Mother Shipton Investigated》
  (London, 1881). British Museum Library 소장 1차 자료를 직접 대조한 조사 보고다.
attribution_note: >-
  이 자료의 기록 신뢰도 A는 "예언이 맞았다"가 아니라 "1881년에 해리슨이 실제로 이 조사를
  남겼음이 확인된다"는 뜻이다. 예언의 진위가 아니라 문헌의 형성 과정을 다룬다.
  제3장은 현전 최고본(1641년 팸플릿)의 축자 재수록이라 1816년 챕북보다 앞선 층위이며,
  제4장은 William Lilly의 1645년판과의 대조다. 제5장에는 Charles Hindley가 1862년
  복각본에 예언을 지어 넣었다고 1873년 Notes and Queries에 자백한 기록이 인용돼 있다.
  예언 텍스트가 후대에 어떻게 불어나고 위조됐는지를 1차 자료로 추적한 자료이므로,
  사후 귀속과 위작을 다루는 위키 페이지의 근거로 쓴다.
